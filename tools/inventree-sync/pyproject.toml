[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-sync"
version = "0.1.0"
description = "One-way InvenTree to SQLite synchronization for Altium DbLib"
requires-python = ">=3.11"
dependencies = ["requests==2.34.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
build = ["pyinstaller==6.22.0"]

[project.scripts]
inventree-sync = "inventree_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

