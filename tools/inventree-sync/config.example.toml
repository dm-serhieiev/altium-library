# SQLite export. inspect also accepts only [inventree] and [scope].
# Filesystem paths are relative to this TOML file. Credentials belong in env.
[inventree]
base_url = "https://inventree.example.com"
auth = "token"
token_env = "INVENTREE_API_TOKEN"
connect_timeout = 10
read_timeout = 60
retries = 3

[scope]
root_category_path = ["Electronic Components"]

[sync]
output = "../../database/components.sqlite"
dblib = "../../database/Components.DbLib"

[libraries]
symbols = "../../symbols"
footprints = "../../footprints"

